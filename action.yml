name: "slopcheck"
description: "Scan codebases and pull request diffs for AI-generated code slop and post a Slop Score report."
author: "an1zy"

branding:
  icon: "shield"
  color: "green"

inputs:
  path:
    description: "Directory or file to scan"
    required: false
    default: "."
  max-score:
    description: "Maximum acceptable Slop Score (0-100)"
    required: false
    default: "20"
  diff-only:
    description: "Scan only lines changed against base_ref on pull requests"
    required: false
    default: "false"
  comment-pr:
    description: "Post or update a sticky Slop Score comment on pull requests"
    required: false
    default: "true"
  fail-on-exceed:
    description: "Fail the workflow step when Slop Score exceeds max-score"
    required: false
    default: "true"
  exclude:
    description: "Comma-separated path prefixes or directories to skip"
    required: false
    default: ""
  svg-path:
    description: "Optional output path for a dark-neon SVG scorecard"
    required: false
    default: ""
  python-version:
    description: "Python version to use for running slopcheck"
    required: false
    default: "3.11"

outputs:
  score:
    description: "Computed Slop Score (0-100)"
    value: ${{ steps.scan.outputs.score }}
  verdict:
    description: "Verdict label (CLEAN, SUSPICIOUS, VIBE-CODED, PURE SLOP)"
    value: ${{ steps.scan.outputs.verdict }}
  badge-url:
    description: "shields.io badge URL for the computed score"
    value: ${{ steps.scan.outputs.badge-url }}
  issues-count:
    description: "Total slop findings count"
    value: ${{ steps.scan.outputs.issues-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install slopcheck
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Run slopcheck
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python -m slopcheck.github_action \
          --path "${{ inputs.path }}" \
          --max-score "${{ inputs.max-score }}" \
          --diff-only "${{ inputs.diff-only }}" \
          --comment-pr "${{ inputs.comment-pr }}" \
          --fail-on-exceed "${{ inputs.fail-on-exceed }}" \
          --exclude "${{ inputs.exclude }}" \
          --svg-path "${{ inputs.svg-path }}"
