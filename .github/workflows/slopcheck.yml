name: Slopcheck PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  slopcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run slopcheck on PR diff
        uses: ./
        with:
          max-score: 0
          diff-only: true
          comment-pr: true
